blueprint:
  name: IKEA Bilresa - multi-light mode wheel controller (button entities)
  description: >-
    Control multiple lights with an IKEA Bilresa remote when exposed as per-mode entities.

    Expected entity model:
    - 3 click entities (left/middle/right) — event entities with native multi_press support
    - 6 "currently scrolling" entities (0/1) for continuous scroll-wheel tracking

    Behavior:
    - Single click toggles the active light.
    - Double click selects the next active light.
    - Triple click selects the previous active light.
    - Active-light changes blink once with flash short feedback.
    - Scroll wheel changes a mode-assigned control:
      brightness, color temperature, scene cycling, or none.

    Notes:
    - Click counting is handled natively by the device firmware (multi_press_1/2/3).
    - Scrolling uses the "currently scrolling" entities and repeats at a configurable interval while the entity is on.
  domain: automation
  input:
    click_left_entity:
      name: Left mode click entity
      selector:
        entity: {}

    click_middle_entity:
      name: Middle mode click entity
      selector:
        entity: {}

    click_right_entity:
      name: Right mode click entity
      selector:
        entity: {}

    currently_scrolling_up_left_entity:
      name: Currently-scrolling UP (left mode)
      description: Entity that is "1" while the wheel is scrolled up in left mode.
      default: ""
      selector:
        entity: {}

    currently_scrolling_down_left_entity:
      name: Currently-scrolling DOWN (left mode)
      description: Entity that is "1" while the wheel is scrolled down in left mode.
      default: ""
      selector:
        entity: {}

    currently_scrolling_up_middle_entity:
      name: Currently-scrolling UP (middle mode)
      description: Entity that is "1" while the wheel is scrolled up in middle mode.
      default: ""
      selector:
        entity: {}

    currently_scrolling_down_middle_entity:
      name: Currently-scrolling DOWN (middle mode)
      description: Entity that is "1" while the wheel is scrolled down in middle mode.
      default: ""
      selector:
        entity: {}

    currently_scrolling_up_right_entity:
      name: Currently-scrolling UP (right mode)
      description: Entity that is "1" while the wheel is scrolled up in right mode.
      default: ""
      selector:
        entity: {}

    currently_scrolling_down_right_entity:
      name: Currently-scrolling DOWN (right mode)
      description: Entity that is "1" while the wheel is scrolled down in right mode.
      default: ""
      selector:
        entity: {}

    active_light_index_helper:
      name: Active light index helper
      description: Input number helper storing active light index (1..number of lights).
      selector:
        entity:
          domain: input_number

    lights:
      name: Lights to control
      description: Choose the lights to cycle through (up to 4 recommended).
      selector:
        entity:
          domain: light
          multiple: true

    left_mode_control:
      name: Left mode controls
      default: brightness
      selector:
        select:
          options:
            - brightness
            - color_temp
            - scenes
            - none

    middle_mode_control:
      name: Middle mode controls
      default: color_temp
      selector:
        select:
          options:
            - brightness
            - color_temp
            - scenes
            - none

    right_mode_control:
      name: Right mode controls
      default: scenes
      selector:
        select:
          options:
            - brightness
            - color_temp
            - scenes
            - none

    brightness_step_pct:
      name: Brightness step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          step: 1

    color_temp_step_kelvin:
      name: Color temperature step (kelvin)
      default: 250
      selector:
        number:
          min: 50
          max: 2000
          mode: slider
          step: 50

    scenes:
      name: Scenes to cycle (optional)
      description: Used if a mode is set to scenes.
      default: []
      selector:
        entity:
          domain: scene
          multiple: true

    scene_index_helper:
      name: Scene index helper (optional)
      description: Input number helper storing scene index (1..number of scenes).
      default: ""
      selector:
        entity:
          domain: input_number

    scroll_repeat_interval_ms:
      name: Scroll repeat interval (ms)
      default: 180
      selector:
        number:
          min: 50
          max: 1000
          step: 10
          mode: slider

mode: restart
max_exceeded: silent

trigger_variables:
  tv_scrolling_up_left: !input currently_scrolling_up_left_entity
  tv_scrolling_down_left: !input currently_scrolling_down_left_entity
  tv_scrolling_up_middle: !input currently_scrolling_up_middle_entity
  tv_scrolling_down_middle: !input currently_scrolling_down_middle_entity
  tv_scrolling_up_right: !input currently_scrolling_up_right_entity
  tv_scrolling_down_right: !input currently_scrolling_down_right_entity

variables:
  click_left_entity: !input click_left_entity
  click_middle_entity: !input click_middle_entity
  click_right_entity: !input click_right_entity

  currently_scrolling_up_left_entity: !input currently_scrolling_up_left_entity
  currently_scrolling_down_left_entity: !input currently_scrolling_down_left_entity
  currently_scrolling_up_middle_entity: !input currently_scrolling_up_middle_entity
  currently_scrolling_down_middle_entity: !input currently_scrolling_down_middle_entity
  currently_scrolling_up_right_entity: !input currently_scrolling_up_right_entity
  currently_scrolling_down_right_entity: !input currently_scrolling_down_right_entity

  idx_helper: !input active_light_index_helper
  lights: !input lights

  left_mode_control: !input left_mode_control
  middle_mode_control: !input middle_mode_control
  right_mode_control: !input right_mode_control

  brightness_step_pct: !input brightness_step_pct
  color_temp_step_kelvin: !input color_temp_step_kelvin

  scenes: !input scenes
  scene_idx_helper: !input scene_index_helper

  scroll_repeat_interval_ms: !input scroll_repeat_interval_ms

trigger:
  - platform: state
    entity_id: !input click_left_entity
    id: click

  - platform: state
    entity_id: !input click_middle_entity
    id: click

  - platform: state
    entity_id: !input click_right_entity
    id: click

  - platform: template
    value_template: "{{ tv_scrolling_up_left != '' and states(tv_scrolling_up_left) == '1' }}"
    id: scrolling_up_left

  - platform: template
    value_template: "{{ tv_scrolling_down_left != '' and states(tv_scrolling_down_left) == '1' }}"
    id: scrolling_down_left

  - platform: template
    value_template: "{{ tv_scrolling_up_middle != '' and states(tv_scrolling_up_middle) == '1' }}"
    id: scrolling_up_middle

  - platform: template
    value_template: "{{ tv_scrolling_down_middle != '' and states(tv_scrolling_down_middle) == '1' }}"
    id: scrolling_down_middle

  - platform: template
    value_template: "{{ tv_scrolling_up_right != '' and states(tv_scrolling_up_right) == '1' }}"
    id: scrolling_up_right

  - platform: template
    value_template: "{{ tv_scrolling_down_right != '' and states(tv_scrolling_down_right) == '1' }}"
    id: scrolling_down_right

condition:
  - condition: template
    value_template: "{{ lights | count > 0 }}"

action:
  - variables:
      light_count: "{{ lights | count }}"
      raw_idx: "{{ states(idx_helper) | int(1) }}"
      clamped_idx: "{{ [1, [raw_idx, light_count] | min] | max }}"
      active_light: "{{ lights[clamped_idx - 1] }}"
      scene_count: "{{ scenes | count }}"

  - choose:
      # ── Click handling (native multi_press from device firmware) ──
      - conditions: >-
          {{ trigger.id == 'click' and
             (state_attr(trigger.entity_id, 'event_type') or '').startswith('multi_press_') }}
        sequence:
          - variables:
              press_count: >-
                {{ state_attr(trigger.entity_id, 'event_type')
                   | replace('multi_press_', '') | int(1) }}

          - choose:
              - conditions: "{{ press_count == 1 }}"
                sequence:
                  - service: homeassistant.toggle
                    target:
                      entity_id: "{{ active_light }}"

              - conditions: "{{ press_count == 2 }}"
                sequence:
                  - variables:
                      next_idx: "{{ (clamped_idx % light_count) + 1 }}"
                      blink_light: "{{ lights[(clamped_idx % light_count)] }}"
                      blink_was_on: "{{ is_state(lights[(clamped_idx % light_count)], 'on') }}"
                  - service: input_number.set_value
                    target:
                      entity_id: !input active_light_index_helper
                    data:
                      value: "{{ next_idx }}"
                  # Blink: toggle to opposite state, wait, toggle back
                  - choose:
                      - conditions: "{{ blink_was_on }}"
                        sequence:
                          - service: light.turn_off
                            target:
                              entity_id: "{{ blink_light }}"
                          - delay:
                              milliseconds: 400
                          - service: light.turn_on
                            target:
                              entity_id: "{{ blink_light }}"
                    default:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ blink_light }}"
                      - delay:
                          milliseconds: 400
                      - service: light.turn_off
                        target:
                          entity_id: "{{ blink_light }}"

              - conditions: "{{ press_count >= 3 }}"
                sequence:
                  - variables:
                      prev_idx: "{{ ((clamped_idx - 2) % light_count) + 1 }}"
                      blink_light: "{{ lights[((clamped_idx - 2) % light_count)] }}"
                      blink_was_on: "{{ is_state(lights[((clamped_idx - 2) % light_count)], 'on') }}"
                  - service: input_number.set_value
                    target:
                      entity_id: !input active_light_index_helper
                    data:
                      value: "{{ prev_idx }}"
                  # Blink: toggle to opposite state, wait, toggle back
                  - choose:
                      - conditions: "{{ blink_was_on }}"
                        sequence:
                          - service: light.turn_off
                            target:
                              entity_id: "{{ blink_light }}"
                          - delay:
                              milliseconds: 400
                          - service: light.turn_on
                            target:
                              entity_id: "{{ blink_light }}"
                    default:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ blink_light }}"
                      - delay:
                          milliseconds: 400
                      - service: light.turn_off
                        target:
                          entity_id: "{{ blink_light }}"

      # ── Scroll handling ──
      - conditions: "{{ trigger.id.startswith('scrolling_') }}"
        sequence:
          - variables:
              mode_name: "{{ 'left' if 'left' in trigger.id else ('middle' if 'middle' in trigger.id else 'right') }}"
              direction: "{{ 'up' if '_up_' in trigger.id else 'down' }}"
              active_control: >-
                {% if mode_name == 'left' %}
                  {{ left_mode_control }}
                {% elif mode_name == 'middle' %}
                  {{ middle_mode_control }}
                {% else %}
                  {{ right_mode_control }}
                {% endif %}
              scroll_state_entity: >-
                {%- set mapping = {
                    'left': {'up': currently_scrolling_up_left_entity, 'down': currently_scrolling_down_left_entity},
                    'middle': {'up': currently_scrolling_up_middle_entity, 'down': currently_scrolling_down_middle_entity},
                    'right': {'up': currently_scrolling_up_right_entity, 'down': currently_scrolling_down_right_entity}
                  } -%}
                {{ mapping.get(mode_name | trim, {}).get(direction | trim, '') }}

          - repeat:
              while:
                - condition: template
                  value_template: "{{ states(scroll_state_entity | trim) == '1' }}"
              sequence:
                - choose:
                    - conditions: "{{ active_control == 'brightness' }}"
                      sequence:
                        - service: light.turn_on
                          target:
                            entity_id: "{{ active_light }}"
                          data:
                            brightness_step_pct: >-
                              {% if direction == 'up' %}
                                {{ brightness_step_pct }}
                              {% else %}
                                {{ -1 * brightness_step_pct }}
                              {% endif %}

                    - conditions: "{{ active_control == 'color_temp' }}"
                      sequence:
                        - variables:
                            current_kelvin: "{{ state_attr(active_light, 'color_temp_kelvin') | int(3500) }}"
                            min_kelvin: "{{ state_attr(active_light, 'min_color_temp_kelvin') | int(2000) }}"
                            max_kelvin: "{{ state_attr(active_light, 'max_color_temp_kelvin') | int(6500) }}"
                            delta: "{{ color_temp_step_kelvin if direction == 'up' else (-1 * color_temp_step_kelvin) }}"
                            candidate_kelvin: "{{ current_kelvin + delta }}"
                            next_kelvin: "{{ [min_kelvin, [candidate_kelvin, max_kelvin] | min] | max }}"
                        - service: light.turn_on
                          target:
                            entity_id: "{{ active_light }}"
                          data:
                            color_temp_kelvin: "{{ next_kelvin }}"

                    - conditions: "{{ active_control == 'scenes' and scene_count > 0 and scene_idx_helper != '' }}"
                      sequence:
                        - variables:
                            raw_scene_idx: "{{ states(scene_idx_helper) | int(1) }}"
                            clamped_scene_idx: "{{ [1, [raw_scene_idx, scene_count] | min] | max }}"
                            next_scene_idx: >-
                              {% if direction == 'up' %}
                                {{ (clamped_scene_idx % scene_count) + 1 }}
                              {% else %}
                                {{ ((clamped_scene_idx - 2) % scene_count) + 1 }}
                              {% endif %}
                        - service: input_number.set_value
                          target:
                            entity_id: !input scene_index_helper
                          data:
                            value: "{{ next_scene_idx }}"
                        - service: scene.turn_on
                          target:
                            entity_id: "{{ scenes[next_scene_idx - 1] }}"

                - delay:
                    milliseconds: !input scroll_repeat_interval_ms
